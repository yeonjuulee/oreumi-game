<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시크릿 오르미">
<meta name="theme-color" content="#FFF1E3">
<title>시크릿 오르미를 찾아라</title>
<link rel="apple-touch-icon" href="assets/secret.png">
<link rel="preload" as="image" href="assets/secret.png">
<style>
@font-face { font-family: "NanumSquareRound"; font-weight: 700; font-display: swap; src: url("fonts/NanumSquareRoundB.woff2") format("woff2"); }
@font-face { font-family: "NanumSquareRound"; font-weight: 800 900; font-display: swap; src: url("fonts/NanumSquareRoundEB.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 600; font-display: swap; src: url("fonts/Pretendard-SemiBold.woff2") format("woff2"); }
@font-face { font-family: "Pretendard"; font-weight: 700; font-display: swap; src: url("fonts/Pretendard-Bold.woff2") format("woff2"); }

:root {
  --orange: #FF6A00;
  --orange-soft: #FF964C;
  --peach: #FFE9D9;
  --cream: #FFF1E3;
  --ink: #332E2A;
  --ink-soft: #5C4A3E;
  --font-round: "NanumSquareRound", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  --font-kr: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  position: fixed; inset: 0; overflow: hidden;
  background: var(--cream);
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
body { font-family: var(--font-kr); color: var(--ink); font-weight: 600; }
img { -webkit-user-drag: none; pointer-events: none; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

/* 무대: 아이패드 11인치 가로(1194×834)를 기준 좌표로 쓰고, 창 크기에 맞춰 통째로 확대·축소한다 */
#stage {
  position: absolute; left: 0; top: 0;
  width: 1194px; height: 834px;
  transform-origin: 0 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse 70% 55% at 50% 108%, #FFD9BC 0%, rgba(255, 217, 188, 0) 70%),
    radial-gradient(ellipse 60% 50% at 50% 0%, #FFFAF4 0%, rgba(255, 250, 244, 0) 75%),
    var(--cream);
}
.screen { position: absolute; inset: 0; display: none; }
.screen.on { display: block; }

/* ---------- 시작 화면 ---------- */
#start { display: none; align-items: center; justify-content: center; gap: 72px; padding: 0 84px; }
#start.on { display: flex; }
.wanted {
  position: relative; flex: 0 0 400px; height: 500px;
  border-radius: 48px; background: #fff;
  box-shadow: 0 30px 60px -24px rgba(255, 106, 0, .38), 0 0 0 3px var(--peach) inset;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding-bottom: 34px;
}
.wanted::before {
  content: ""; position: absolute; left: 50%; top: 96px; width: 300px; height: 300px;
  margin-left: -150px; border-radius: 50%;
  background: radial-gradient(circle, #FFE3CC 0%, rgba(255, 227, 204, 0) 70%);
}
.wanted .tag {
  position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
  white-space: nowrap; padding: 10px 22px; border-radius: 99px;
  background: var(--ink); color: #fff;
  font-family: var(--font-round); font-weight: 800; font-size: 19px; letter-spacing: .08em;
}
.wanted img { position: relative; width: 268px; animation: bob 2.6s ease-in-out infinite; filter: brightness(0); }
.wanted .name { position: relative; margin-top: 18px; font-family: var(--font-round); font-weight: 800; font-size: 28px; }
.wanted .clue { position: relative; margin-top: 8px; font-size: 18px; color: var(--ink-soft); }
.intro { flex: 1 1 auto; max-width: 560px; }
.intro .eyebrow { font-family: var(--font-round); font-weight: 800; font-size: 20px; color: var(--orange); letter-spacing: .04em; }
.intro h1 { margin-top: 14px; font-family: var(--font-round); font-weight: 800; font-size: 68px; line-height: 1.16; letter-spacing: -.03em; }
.intro h1 em { font-style: normal; color: var(--orange); }
.intro p { margin-top: 22px; font-size: 23px; line-height: 1.55; color: var(--ink-soft); word-break: keep-all; }
.steps { margin-top: 26px; display: flex; gap: 10px; list-style: none; }
.steps li { padding: 11px 18px; border-radius: 99px; background: #fff; box-shadow: 0 0 0 2px var(--peach) inset; font-size: 17px; white-space: nowrap; }
.steps b { color: var(--orange); font-weight: 700; margin-right: 6px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 88px; padding: 0 56px; border-radius: 99px;
  background: var(--orange); color: #fff;
  font-family: var(--font-round); font-weight: 800; font-size: 32px;
  box-shadow: 0 10px 0 #D95A00, 0 26px 34px -12px rgba(255, 106, 0, .55);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(8px); box-shadow: 0 2px 0 #D95A00, 0 10px 18px -10px rgba(255, 106, 0, .55); }
.intro .btn { margin-top: 40px; animation: nudge 1.8s ease-in-out infinite; }
.intro .btn:active { animation: none; }
.peek { position: absolute; opacity: .95; }
.peek.a { width: 210px; left: -46px; bottom: -34px; transform: rotate(14deg); }
.peek.b { width: 190px; right: -30px; top: -40px; transform: rotate(-160deg); }
.peek.c { width: 150px; right: 70px; bottom: -22px; }

/* ---------- 게임 화면 ---------- */
#hud {
  position: absolute; left: 0; right: 0; top: 0; height: 96px; z-index: 5000;
  display: flex; align-items: center; gap: 18px; padding: 0 28px;
  background: linear-gradient(#FFF6EC 62%, rgba(255, 246, 236, 0));
  pointer-events: none;
}
.pill {
  height: 52px; padding: 0 22px; border-radius: 99px; background: #fff;
  box-shadow: 0 0 0 2px var(--peach) inset;
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-round); font-weight: 800; font-size: 20px; white-space: nowrap;
}
.pill small { font-size: 15px; color: var(--orange); letter-spacing: .08em; }
.dots { display: flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--peach); }
.dots i.now { background: var(--orange); }
.dots i.ok { background: var(--ink); }
.dots i.miss { background: #D9CDC3; }
.mission { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: var(--font-round); font-weight: 800; font-size: 24px; }
.mission img { width: 54px; height: 62px; object-fit: contain; }
.mission em { font-style: normal; color: var(--orange); }
.timer { min-width: 132px; justify-content: center; font-variant-numeric: tabular-nums; }
.timer b { font-size: 26px; }
.timer.low { background: var(--orange); color: #fff; box-shadow: none; animation: beat .5s ease-in-out infinite; }
.timer.low small { color: #fff; }
#home { pointer-events: auto; width: 52px; height: 52px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--peach) inset; display: grid; place-items: center; }
#home svg { width: 24px; height: 24px; }
#bar { position: absolute; left: 28px; right: 28px; top: 84px; height: 8px; border-radius: 99px; background: var(--peach); overflow: hidden; z-index: 5001; }
#bar i { display: block; height: 100%; width: 100%; border-radius: 99px; background: var(--orange); transform-origin: 0 50%; }

#field { position: absolute; inset: 0; }
.sp { position: absolute; will-change: transform; }
.sp::before {
  content: ""; position: absolute; left: 12%; right: 12%; bottom: -5%; height: 16%;
  border-radius: 50%; background: radial-gradient(ellipse, rgba(170, 84, 20, .26) 0%, rgba(170, 84, 20, 0) 70%);
}
.sp .fl { position: absolute; inset: 0; }
.sp.flip .fl { transform: scaleX(-1); }
.sp img { width: 100%; height: 100%; animation: bob var(--dur, 2.8s) ease-in-out var(--delay, 0s) infinite; }
.sp.pop { animation: pop .5s cubic-bezier(.3, 1.5, .5, 1) var(--in, 0s) backwards; }
.sp.no { animation: shake .42s ease-in-out; }
#field.done .sp { transition: opacity .4s, filter .4s; opacity: .22; filter: grayscale(.5); }
#field.done .sp img { animation-play-state: paused; }
#field.done .sp.target { opacity: 1; filter: none; z-index: 4000 !important; transition: transform .6s cubic-bezier(.3, 1.5, .5, 1); transform: scale(1.5); }
#field.done .sp.target img { animation: bob .7s ease-in-out infinite; }
.ring {
  position: absolute; z-index: 3999; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 255, 255, .95) 0%, rgba(255, 233, 217, .9) 45%, rgba(255, 233, 217, 0) 70%);
  animation: ring 1.6s ease-out infinite;
}
.bit { position: absolute; z-index: 4500; width: 14px; height: 14px; border-radius: 4px; pointer-events: none; animation: burst .9s cubic-bezier(.1, .7, .3, 1) forwards; }
.float { position: absolute; z-index: 4600; pointer-events: none; transform: translate(-50%, -100%); padding: 8px 16px; border-radius: 99px; background: var(--ink); color: #fff; font-family: var(--font-round); font-weight: 800; font-size: 20px; white-space: nowrap; animation: rise .9s ease-out forwards; }

#toast {
  position: absolute; left: 50%; bottom: 44px; z-index: 5100; transform: translateX(-50%) translateY(30px);
  padding: 20px 40px; border-radius: 99px; background: var(--ink); color: #fff;
  font-family: var(--font-round); font-weight: 800; font-size: 30px; white-space: nowrap;
  opacity: 0; transition: opacity .3s, transform .4s cubic-bezier(.3, 1.5, .5, 1); pointer-events: none;
}
#toast.on { opacity: 1; transform: translateX(-50%); }
#toast em { font-style: normal; color: var(--orange-soft); }

#card { position: absolute; inset: 0; z-index: 5200; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(255, 241, 227, .92); }
#card.on { display: flex; animation: fade .25s ease-out; }
#card .rd { font-family: var(--font-round); font-weight: 800; font-size: 26px; color: var(--orange); letter-spacing: .14em; }
#card .tt { margin-top: 12px; font-family: var(--font-round); font-weight: 800; font-size: 60px; letter-spacing: -.02em; animation: pop .5s cubic-bezier(.3, 1.5, .5, 1) backwards; }
#card .ds { margin-top: 14px; font-size: 24px; color: var(--ink-soft); }

/* ---------- 결과 화면 ---------- */
#result { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#result.on { display: flex; }
#result .hero { width: 220px; animation: bob 2.2s ease-in-out infinite; }
#result h2 { margin-top: 20px; font-family: var(--font-round); font-weight: 800; font-size: 58px; letter-spacing: -.03em; }
#result h2 em { font-style: normal; color: var(--orange); }
#result .sub { margin-top: 12px; font-size: 24px; color: var(--ink-soft); }
.stats { margin-top: 30px; display: flex; gap: 16px; }
.stat { min-width: 210px; padding: 20px 28px; border-radius: 28px; background: #fff; box-shadow: 0 0 0 2px var(--peach) inset; }
.stat span { display: block; font-size: 17px; color: var(--ink-soft); }
.stat b { display: block; margin-top: 4px; font-family: var(--font-round); font-weight: 800; font-size: 40px; font-variant-numeric: tabular-nums; }
.stat b small { font-size: 22px; margin-left: 2px; }
#result .btn { margin-top: 38px; }
#result .auto { margin-top: 24px; font-size: 17px; color: #A8998D; font-variant-numeric: tabular-nums; }

#rotate { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; background: var(--cream); font-family: var(--font-round); font-weight: 800; font-size: 22px; text-align: center; }
#rotate img { width: 150px; }
@media (orientation: portrait) { #rotate { display: flex; } }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes pop { from { transform: scale(0); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px) rotate(-4deg); } 40% { transform: translateX(8px) rotate(4deg); } 60% { transform: translateX(-6px) rotate(-2deg); } 80% { transform: translateX(4px); } }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes ring { 0% { transform: scale(.7); opacity: 1; } 100% { transform: scale(1.25); opacity: .55; } }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
@keyframes rise { 0% { opacity: 0; margin-top: 10px; } 20% { opacity: 1; margin-top: 0; } 100% { opacity: 0; margin-top: -40px; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sp img, .wanted img, #result .hero, .intro .btn { animation: none; } }
</style>
</head>
<body>

<div id="stage">

      <p>오르미 친구들 사이에 시크릿 오르미가 딱 한 마리 숨어 있어요. 시간 안에 찾아서 톡 눌러 주세요.</p>

  <section class="screen" id="game">

      <div class="stat"><span>찾은 시크릿 오르미</span><b id="resFound"></b></div>
      <div class="stat"><span>찾는 데 걸린 시간</span><b id="resTime"></b></div>
    </div>
    <button class="btn" id="btnAgain">다시 하기</button>
    <p class="auto" id="resAuto"></p>
  </section>

</div>

<div id="rotate"><img src="assets/oreumi-8.png" alt=""><p>아이패드를 가로로 돌려 주세요</p></div>

<script>
(function () {
  'use strict';

  // 캐릭터별 크기와 32×32 불투명 마스크(행마다 16진수 8자리). k는 갈기 크기를 서로 맞추기 위한 너비 보정값.
  var ART = {

    'oreumi-4': { w: 455, h: 520, k: 1.04, mask: '0007e000000ff800001ffc0003ffffc00ffffff01ffffff81ffffff83ffffffc3ffffffc3ffffffc7ffffffcfffffffeffffffffffffffffffffffff7fffffff7ffffffefffffffcfffffffcfffffffc7ffffffc3ffffff80ffffff00fffffc007ffffc003ffff0003ffff0003ffff8001f87f8000f07f0000003e0000001c00' },

    'secret':   { w: 455, h: 520, k: 1.00, mask: '003e7c00007ffe0000ffff0001ffff800ffffff03ffffffc3ffffffc7ffffffe7ffffffe7ffffffe7ffffffeffffffffffffffffffffffff7ffffffe7ffffffe7ffffffe7ffffffe7ffffffc3ffffffc1ffffff80ffffff001ffff8001ffff0001ffff0001ffff00003ff800003ff800003ff800003ff800003ff800001ff800' }

  var NORMAL = Object.keys(ART).filter(function (n) { return n !== 'secret'; });

    var a = ART[n], rows = [];

    a.rows = rows;
    new Image().src = 'assets/' + n + '.png';
  });

  // 라운드 구성: 뒤로 갈수록 오르미가 많아지고 작아진다. t는 제한 시간(초).
  var ROUNDS = [
    { cols: 6,  rows: 3, base: 176, t: 20, title: '몸풀기',       desc: '오르미 18마리 사이에 숨었어요' },

  var LOW_AT = 3, HUD_H = 100, IDLE_RESET = 30;

  var $ = function (id) { return document.getElementById(id); };

    W = 1194; scale = vw / W; H = vh / scale;
    if (H < 700) { H = 700; scale = vh / H; W = vw / scale; }
    stage.style.width = W + 'px';
    stage.style.height = H + 'px';
    stage.style.transform = 'scale(' + scale + ')';

  }
  // 캐릭터 위치는 무대 비율(u, v)로 기억해 두었다가, 창 크기가 바뀌면 같은 비율로 다시 놓는다.
  function place(s) {
    var fy = HUD_H + s.v * (H - 26 - HUD_H);
    var cx = Math.max(s.w / 2 + 6, Math.min(W - s.w / 2 - 6, s.u * W));
    fy = Math.max(HUD_H - 6 + s.h, Math.min(H - 12, fy));
    s.x = cx - s.w / 2; s.y = fy - s.h;
    s.el.style.left = s.x.toFixed(1) + 'px';
    s.el.style.top = s.y.toFixed(1) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
  fit();

  function later(fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); clearInterval(autoTimer); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }
  function show(id) {
    ['start', 'game', 'result'].forEach(function (s) { $(s).classList.toggle('on', s === id); });
  }

  // ---------- 효과음 (첫 터치 때 오디오가 열린다) ----------
  var actx = null;
  function tone(freq, at, dur, type, vol) {
    if (!actx) return;
    var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + at;
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.16, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function unlockAudio() {
    try {
      if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  var sfx = {
    tap:  function () { tone(520, 0, 0.09, 'triangle'); },
    no:   function () { tone(220, 0, 0.14, 'square', 0.07); tone(170, 0.1, 0.18, 'square', 0.07); },
    yes:  function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.09, 0.26, 'triangle'); }); },
    miss: function () { tone(392, 0, 0.22, 'sine'); tone(294, 0.2, 0.4, 'sine'); },
    tick: function () { tone(880, 0, 0.06, 'sine', 0.08); }
  };

  // ---------- 라운드 ----------
  function startGame() {
    clearTimers();
    results = []; round = 0;
    show('game');
    introRound();
  }

  function introRound() {
    var cfg = ROUNDS[round];
    state = 'intro';
    field.innerHTML = ''; sprites = []; field.classList.remove('done');
    toast.classList.remove('on');
    $('roundNo').textContent = (round + 1) + ' / ' + ROUNDS.length;
    $('dots').innerHTML = ROUNDS.map(function (_, i) {
      var c = i < round ? (results[i].found ? 'ok' : 'miss') : (i === round ? 'now' : '');
      return '<i class="' + c + '"></i>';
    }).join('');
    setClock(cfg.t, cfg.t);
    card.querySelector('.rd').textContent = 'ROUND ' + (round + 1);
    card.querySelector('.tt').textContent = cfg.title;
    card.querySelector('.ds').textContent = cfg.desc;
    card.classList.add('on');
    later(function () {
      card.classList.remove('on');
      build(cfg);
      later(function () {
        state = 'play';
        total = cfg.t * 1000; startedAt = performance.now(); deadline = startedAt + total;
        lastTick = -1;
        raf = requestAnimationFrame(loop);
      }, 650);
    }, 1500);
  }

  // 벽돌처럼 엇갈린 격자에 흩뿌리고, 발 위치(y)가 아래일수록 앞에 오도록 겹친다.
  function build(cfg) {
    sprites = []; target = null;
    var n = cfg.cols * cfg.rows, padX = 34, top = HUD_H, bottom = H - 26;
    var cellW = (W - padX * 2) / cfg.cols, cellH = (bottom - top) / cfg.rows;
    var secretAt = Math.floor(Math.random() * n);
    var bag = [];
    while (bag.length < n) bag = bag.concat(shuffle(NORMAL.slice()));
    var frag = document.createDocumentFragment();
    for (var r = 0; r < cfg.rows; r++) {
      for (var c = 0; c < cfg.cols; c++) {
        var i = r * cfg.cols + c, isSecret = i === secretAt;
        var name = isSecret ? 'secret' : bag[i], art = ART[name];
        var w = cfg.base * art.k * rand(0.93, 1.07), h = w * art.h / art.w;
        var cx = padX + (c + 0.5 + (r % 2 ? 0.22 : -0.22)) * cellW + rand(-0.16, 0.16) * cellW;
        var fy = top + (r + 1) * cellH - 4 + rand(-0.12, 0.12) * cellH;
        var s = { name: name, art: art, u: cx / W, v: (fy - top) / (bottom - top), w: w, h: h, z: Math.round(fy), flip: Math.random() < 0.5, secret: isSecret };
        var el = document.createElement('div');
        el.className = 'sp pop' + (s.flip ? ' flip' : '') + (isSecret ? ' target' : '');
        el.style.cssText = 'width:' + w.toFixed(1) + 'px;height:' + h.toFixed(1) + 'px;z-index:' + s.z +
          ';--in:' + rand(0, 0.3).toFixed(2) + 's;--delay:-' + rand(0, 3).toFixed(2) + 's;--dur:' + rand(2.4, 3.4).toFixed(2) + 's';
        el.innerHTML = '<div class="fl"><img src="assets/' + name + '.png" alt=""></div>';
        s.el = el; place(s); sprites.push(s); frag.appendChild(el);
        if (isSecret) target = s;
      }
    }
    field.appendChild(frag);
    sprites.sort(function (a, b) { return b.z - a.z; });
  }

  var lastTick = -1;
  function setClock(leftSec, totalSec) {
    var shown = Math.max(0, Math.ceil(leftSec));
    $('sec').textContent = shown;
    $('bar').firstElementChild.style.transform = 'scaleX(' + Math.max(0, leftSec / totalSec).toFixed(4) + ')';
    $('timer').classList.toggle('low', leftSec <= LOW_AT && leftSec > 0);
    return shown;
  }
  function loop(now) {
    if (state !== 'play') return;
    var left = (deadline - now) / 1000;
    var shown = setClock(left, total / 1000);
    if (left <= LOW_AT && shown !== lastTick && shown > 0) { lastTick = shown; sfx.tick(); }
    if (left <= 0) return finish(false);
    raf = requestAnimationFrame(loop);
  }

  // ---------- 터치 판정 ----------
  function opaque(s, px, py) {
    var u = (px - s.x) / s.w, v = (py - s.y) / s.h;
    if (u < 0 || u >= 1 || v < 0 || v >= 1) return false;
    if (s.flip) u = 1 - u;
    return ((s.art.rows[Math.floor(v * 32)] >>> (31 - Math.floor(u * 32))) & 1) === 1;
  }
  function pick(px, py) {
    for (var i = 0; i < sprites.length; i++) if (opaque(sprites[i], px, py)) return sprites[i];
    return null;
  }
  // 손가락이 살짝 빗나가도 잡히도록 주변 8곳을 한 번 더 본다.
  function pickNear(px, py) {
    var hit = pick(px, py);
    for (var a = 0; !hit && a < 8; a++) hit = pick(px + Math.cos(a * Math.PI / 4) * 14, py + Math.sin(a * Math.PI / 4) * 14);
    return hit;
  }

  field.addEventListener('pointerdown', function (e) {
    if (state !== 'play') return;
    var px = e.clientX / scale, py = e.clientY / scale;
    var hit = pickNear(px, py);
    if (!hit) return;
    if (hit.secret) return finish(true);
    // 오답이면 그 라운드는 바로 실패. 틀린 오르미가 흔들리는 걸 잠깐 보여 준 뒤 정답을 공개한다.
    state = 'reveal';
    cancelAnimationFrame(raf);
    sfx.no();
    hit.el.classList.remove('pop', 'no');
    void hit.el.offsetWidth;
    hit.el.classList.add('no');
    floatText(px, py - 20, '땡!');
    later(function () { finish(false, true); }, 500);
  });
  field.addEventListener('animationend', function (e) {
    if (e.target.classList.contains('sp')) e.target.classList.remove('pop', 'no');
  });

  function floatText(x, y, text) {
    var el = document.createElement('div');
    el.className = 'float'; el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    field.appendChild(el);
    later(function () { el.remove(); }, 950);
  }

  function finish(found, wrong) {
    state = 'reveal';
    cancelAnimationFrame(raf);
    var took = Math.min(total, performance.now() - startedAt) / 1000;
    results.push({ found: found, time: took });
    $('timer').classList.remove('low');
    target.el.classList.remove('pop', 'no');
    // 가장자리에서 커져도 잘리지 않게 확대 기준점을 화면 안쪽으로 둔다.
    var cx = target.x + target.w / 2, cy = target.y + target.h / 2;
    target.el.style.transformOrigin = (cx < 140 ? '0%' : cx > W - 140 ? '100%' : '50%') + ' ' + (cy < HUD_H + 120 ? '0%' : cy > H - 130 ? '100%' : '50%');
    field.classList.add('done');
    var d = Math.max(target.w, target.h) * 2.6, ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.cssText = 'left:' + (cx - d / 2) + 'px;top:' + (cy - d / 2) + 'px;width:' + d + 'px;height:' + d + 'px';
    field.appendChild(ring);
    if (found) {
      sfx.yes(); confetti(cx, cy);
      toast.innerHTML = '찾았다! <em>' + took.toFixed(1) + '초</em>';
    } else {
      sfx.miss();
      toast.innerHTML = (wrong ? '앗, 아니에요!' : '시간 끝!') + ' <em>여기 숨어 있었어요</em>';
    }
    toast.classList.add('on');
    later(function () {
      round++;
      if (round < ROUNDS.length) introRound(); else showResult();
    }, found ? 2300 : 2900);
  }

  function confetti(cx, cy) {
    var colors = ['#FF6A00', '#FF964C', '#FFB27A', '#332E2A', '#FFFFFF', '#FFD23F'];
    for (var i = 0; i < 34; i++) {
      var el = document.createElement('div'), ang = rand(0, Math.PI * 2), dist = rand(120, 300);
      el.className = 'bit';
      el.style.cssText = 'left:' + cx + 'px;top:' + cy + 'px;background:' + colors[i % colors.length] +
        ';--dx:' + (Math.cos(ang) * dist).toFixed(0) + 'px;--dy:' + (Math.sin(ang) * dist - 60).toFixed(0) + 'px;--rot:' + rand(-540, 540).toFixed(0) + 'deg' +
        (i % 3 === 0 ? ';border-radius:50%' : '');
      field.appendChild(el);
      (function (node) { later(function () { node.remove(); }, 950); })(el);
    }
  }

  // ---------- 결과 ----------
  function showResult() {
    state = 'result';
    var found = results.filter(function (r) { return r.found; });
    var time = found.reduce(function (s, r) { return s + r.time; }, 0);
    var n = found.length, all = ROUNDS.length;
    var copy = n === all ? ['<em>시크릿 오르미</em>를 모두 찾았어요!', '눈썰미가 정말 대단해요. 오르미 탐정으로 임명합니다.', 'oreumi-4']
      : n > 0 ? ['<em>시크릿 오르미</em> ' + n + '마리 발견!', '아깝다! 한 번 더 하면 모두 찾을 수 있어요.', 'oreumi-1']
      : ['<em>시크릿 오르미</em>가 꼭꼭 숨었네요', '갈색 코를 기억하고 다시 도전해 보세요.', 'oreumi-5'];
    $('resTitle').innerHTML = copy[0];
    $('resSub').textContent = copy[1];
    $('resHero').src = 'assets/' + copy[2] + '.png';
    $('resFound').innerHTML = n + '<small> / ' + all + '</small>';
    $('resTime').innerHTML = n ? time.toFixed(1) + '<small>초</small>' : '-';
    show('result');
    if (n === all) sfx.yes();
    // 다음 관람객을 위해 잠시 뒤 시작 화면으로 돌아간다.
    var left = IDLE_RESET;
    $('resAuto').textContent = left + '초 뒤 처음 화면으로 돌아가요';
    autoTimer = setInterval(function () {
      left--;
      $('resAuto').textContent = left + '초 뒤 처음 화면으로 돌아가요';
      if (left <= 0) goStart();
    }, 1000);
  }

  function goStart() {
    clearTimers();
    state = 'start';
    card.classList.remove('on'); toast.classList.remove('on');
    field.innerHTML = ''; sprites = [];
    show('start');
  }

  $('btnStart').addEventListener('click', function () { unlockAudio(); sfx.tap(); startGame(); });
  $('btnAgain').addEventListener('click', function () { unlockAudio(); sfx.tap(); startGame(); });
  $('home').addEventListener('click', goStart);

  // 전시용: 확대·스크롤·길게 누르기 메뉴를 막는다.
  ['gesturestart', 'gesturechange', 'contextmenu', 'dragstart', 'selectstart'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); });
  });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  var lastEnd = 0;
  document.addEventListener('touchend', function (e) {
    var now = Date.now();
    if (now - lastEnd < 320 && !e.target.closest('button')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
})();
</script>
</body>
</html>
